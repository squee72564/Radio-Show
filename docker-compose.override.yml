services:
  icecast:
    env_file:
      - .env.dev
    volumes:
      - ./icecast/icecast_template.xml:/etc/icecast2/icecast_template.xml:ro
      - icecast-logs-dev:/var/log/icecast2
    ports:
      - "8000:8000"

  liquidsoap:
    env_file:
      - .env.dev
    volumes:
      - ./liquidsoap:/app
      - ./liquidsoap/files:/app/files

  postgres:
    env_file:
      - .env.dev
    ports:
      - "15432:5432"
    volumes:
      - dev-postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env.dev
    volumes:
      - minio-data-dev:/data
    networks:
      - backend
    command: server /data --console-address ":9001"

  prometheus:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data-dev:/prometheus

  grafana:
    env_file:
      - .env.dev
    volumes:
      - grafana-storage-dev:/var/lib/grafana

volumes:
  grafana-storage-dev:
  dev-postgres-data:
  minio-data-dev:
  prometheus-data-dev:
  icecast-logs-dev:
