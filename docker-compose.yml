services:
  icecast:
    build: ./icecast
    container_name: icecast
    networks:
      - backend
    restart: unless-stopped
    user: icecast2
    command: ./entrypoint.sh

  liquidsoap:
    build: ./liquidsoap
    container_name: liquidsoap
    ports:
      - "8005:8005"
    depends_on:
      - icecast
    networks:
      - backend
    restart: unless-stopped
    command: liquidsoap /app/script.liq

  postgres:
    image: postgres:15
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    networks:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge
