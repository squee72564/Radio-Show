global:
  scrape_interval: 15s

rule_files:
  - "/etc/prometheus/redis_exporter_recording_rules.yml"

scrape_configs:
  - job_name: redis_exporter
    static_configs:
      - targets: ['redis-exporter:9121']
  - job_name: "Mugen Beat Webapp"
    static_configs:
      - targets: ["webapp:3000"]
    metrics_path: "/api/metrics"
